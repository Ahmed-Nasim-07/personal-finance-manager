<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Income</title>
</head>

<body>

    <h1>Edit Income</h1>

    <form method="POST">

        <label for="amount">Amount</label>
        <input
            type="number"
            id="amount"
            name="amount"
            value="{{ income.amount }}"
            step="0.01"
            min="0"
            required
        >

        <br><br>

        <label for="description">Description</label>
        <input
            type="text"
            id="description"
            name="description"
            value="{{ income.description or '' }}"
            maxlength="255"
        >

        <br><br>

        <label for="category_id">Category</label>
        <select id="category_id" name="category_id" required>

            {% for category in categories %}
                <option
                    value="{{ category.id }}"
                    {% if category.id == income.category_id %}selected{% endif %}
                >
                    {{ category.name }}
                </option>
            {% endfor %}

        </select>

        <br><br>

        <label for="date">Date</label>
        <input
            type="date"
            id="date"
            name="date"
            value="{{ income.date }}"
            required
        >

        <br><br>

        <button type="submit">Save Changes</button>

    </form>

    <br>

    <a href="{{ url_for('income.list_income') }}">
        Back to Income
    </a>

</body>
</html>
