<!DOCTYPE html>
<html>
<head>
    <title>Edit Expense</title>
</head>

<body>

    <h1>Edit Expense</h1>

    <form method="POST">

        <label for="amount">Amount</label>
        <input
            type="number"
            step="0.01"
            id="amount"
            name="amount"
            value="{{ expense.amount }}"
            required
        >

        <br><br>

        <label for="description">Description</label>
        <input
            type="text"
            id="description"
            name="description"
            value="{{ expense.description }}"
            required
        >

        <br><br>

        <label for="date">Date</label>
        <input
            type="date"
            id="date"
            name="date"
            value="{{ expense.date }}"
            required
        >

        <br><br>

        <button type="submit">Save Changes</button>

    </form>

</body>
</html>
