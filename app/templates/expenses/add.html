<!DOCTYPE html>
<html>
<head>
    <title>Add Expense</title>
</head>

<body>

    <h1>Add Expense</h1>

    <form method="POST">

        <label for="amount">Amount</label>
        <input
            type="number"
            id="amount"
            name="amount"
            step="0.01"
            min="0"
            required
        >

        <br><br>

        <label for="description">Description</label>
        <input
            type="text"
            id="description"
            name="description"
        >

        <br><br>

        <label for="date">Date</label>
        <input
            type="date"
            id="date"
            name="date"
            required
        >

        <br><br>

        <button type="submit">Add Expense</button>

    </form>

    <a href="{{ url_for('expenses.list_expenses') }}">
        Back to expenses
    </a>

</body>
</html>
