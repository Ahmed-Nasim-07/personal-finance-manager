<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories</title>
</head>

<body>

    <h1>Categories</h1>

    <a href="{{ url_for('categories.add_category') }}">
        Add Category
    </a>

    <hr>

    {% if categories %}

        <ul>
            {% for category in categories %}
                <li>
                    {{ category.name }} - {{ category.type }}
                
                    <a href="{{ url_for('categories.edit_category', category_id=category.id) }}">
                        Edit
                    </a>
                
                    <form method="POST" action="{{ url_for('categories.delete_category', category_id=category.id) }}"
                        style="display: inline;">
                        <button type="submit">Delete</button>
                    </form>
                </li>
            {% endfor %}
        </ul>

    {% else %}

        <p>You don't have any categories yet.</p>

    {% endif %}

</body>
</html>
