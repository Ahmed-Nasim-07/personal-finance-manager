<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Category</title>
</head>

<body>

    <h1>Edit Category</h1>

    <form method="POST">

        <label for="name">Category Name</label>
        <input
            type="text"
            id="name"
            name="name"
            value="{{ category.name }}"
            required
        >

        <br><br>

        <label for="type">Type</label>

        <select id="type" name="type" required>

            <option
                value="expense"
                {% if category.type == "expense" %}selected{% endif %}
            >
                Expense
            </option>

            <option
                value="income"
                {% if category.type == "income" %}selected{% endif %}
            >
                Income
            </option>

        </select>

        <br><br>

        <button type="submit">Save Changes</button>

    </form>

    <br>

    <a href="{{ url_for('categories.list_categories') }}">
        Cancel
    </a>

</body>
</html>
